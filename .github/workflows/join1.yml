name: Join 1 - agent variety test

# Manual trigger only: no push or pull_request event can start a paid run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no API call, no cost)"
        type: boolean
        default: true
      agents:
        description: "Number of agents (30 = about 150 calls, 300 = about 1,200 calls)"
        type: choice
        options: ["30", "300"]
        default: "30"
      holdout:
        description: "Share kept silent as a control group"
        type: choice
        options: ["0", "0.2"]
        default: "0"

permissions:
  contents: write   # commit the results
  id-token: write   # request GitHub's OIDC token for Workload Identity Federation

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the main branch matches the Anthropic federation rule.
    if: github.ref == 'refs/heads/main'
    env:
      # Identifiers only, not secrets: they are useless without a token
      # that GitHub signs for this exact repository and branch.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_013hfvsL8VjoUeXgKajJ7AxY
      ANTHROPIC_ORGANIZATION_ID: 5b9711b8-c1f4-4782-be06-7053cbe39056
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_018ocqRUvU8M7yh6jMtWvvHx
      ANTHROPIC_WORKSPACE_ID: wrkspc_01WH9RekNabRf4CZdnVmBUMq
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: python join1/run.py --dry-run
      - name: Fetch GitHub OIDC token
        if: ${{ !inputs.dry_run }}
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > /tmp/gha-jwt
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=/tmp/gha-jwt" >> "$GITHUB_ENV"
      - name: Live run
        if: ${{ !inputs.dry_run }}
        run: |
          pip install --quiet anthropic
          python join1/run.py --agents ${{ inputs.agents }} --holdout ${{ inputs.holdout }} --max-calls 1500
          python join1/measure.py | tee -a "$GITHUB_STEP_SUMMARY"
          python viewer/build.py
      - name: Commit results
        run: |
          git config user.name "scm-bot"
          git config user.email "scm-bot@users.noreply.github.com"
          git add results/ docs/data.json
          git diff --cached --quiet || git commit -m "Join 1 results"
          git push
